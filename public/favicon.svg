<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Ambient Mesh -->
    <radialGradient id="bgGrad" cx="30%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#141c38" />
      <stop offset="60%" stop-color="#060814" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>

    <!-- Liquid Fluid Caustics -->
    <linearGradient id="liquidMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.9" />
    </linearGradient>

    <!-- Specular Top Rim Highlight -->
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Monogram Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow & Blur Filters -->
    <filter id="liquidGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#00F0FF" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#bgGrad)" filter="url(#cardShadow)" />

  <!-- Liquid Caustic Orb 1 (Cyan) -->
  <circle cx="150" cy="140" r="140" fill="#00F0FF" opacity="0.35" filter="url(#liquidGlow)" />

  <!-- Liquid Caustic Orb 2 (Royal Indigo) -->
  <circle cx="360" cy="370" r="150" fill="#6366F1" opacity="0.4" filter="url(#liquidGlow)" />

  <!-- Frosted Glass Slab Inner Surface -->
  <rect x="52" y="52" width="408" height="408" rx="100" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />

  <!-- Specular Reflection Sheen -->
  <path d="M 52 152 Q 256 92 460 152 L 460 52 Q 256 52 52 52 Z" fill="url(#specularRim)" opacity="0.5" />

  <!-- VB Monogram Glyph -->
  <g transform="translate(256, 256)">
    <!-- Cyan Sub-glow -->
    <text x="0" y="48" font-family="'Sora', 'Inter', -apple-system, sans-serif" font-size="200" font-weight="900" text-anchor="middle" letter-spacing="-6" fill="#00F0FF" opacity="0.4" filter="url(#liquidGlow)">VB</text>
    
    <!-- Sharp Foreground Text -->
    <text x="0" y="48" font-family="'Sora', 'Inter', -apple-system, sans-serif" font-size="200" font-weight="900" text-anchor="middle" letter-spacing="-6" fill="url(#textGrad)">VB</text>
  </g>

  <!-- Specular 1px Top-Left Corner Glint -->
  <circle cx="110" cy="110" r="4" fill="#FFFFFF" opacity="0.9" />
  <circle cx="110" cy="110" r="12" fill="#00F0FF" opacity="0.5" />
</svg>